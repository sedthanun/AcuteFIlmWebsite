<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | AcuteFilm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
    <script src="https://kit.fontawesome.com/6719d38d22.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <nav class="navbar" id="navbar">
        <a class="navbar-brand" href="index.html">
            <img src="img/logo-new.png" alt="AcuteFilm Logo">
        </a>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">หน้าแรก</a></li>
            <li class="dropdown">
                <a href="#">ผลงาน <i class="fas fa-chevron-down" style="font-size: 0.8rem; margin-left: 0.3rem;"></i></a>
                <div class="dropdown-content">
                    <a href="movie.html">ภาพยนตร์</a>
                    <a href="services.html">ลูกค้าของเรา</a>
                </div>
            </li>
            <li><a href="news.html" class="active">ข่าวสาร</a></li>
            <li><a href="about-us.html">ติดต่อเรา</a></li>
        </ul>
        <div class="menu-toggle" id="mobile-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <section class="hero" style="height: 50vh;">
        <img src="img/lens.jpg" alt="News Hero" class="hero-bg">
        <div class="hero-overlay" style="background: linear-gradient(to bottom, transparent, var(--bg-color));"></div>
        <div class="container">
            <div class="hero-content">
                <h1>ข่าวสาร กิจกรรม</h1>
                <p>อัปเดตข่าวสารล่าสุดจาก AcuteFilm และเบื้องหลังการถ่ายทำ</p>
            </div>
        </div>
    </section>

    <section class="news-section" style="padding-top: 0;">
        <div class="container">
            <div class="news-grid" id="news-all-container">
            </div>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://github.com/sedthanun/AcuteFIlmWebsite/"><i class="fab fa-github"></i></a>
            <a href="https://www.youtube.com/@acutefilm"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/acutefilm"><i class="fab fa-facebook"></i></a>
        </div>
        <p class="copyright">All rights reserved. JJDS 2026</p>
    </footer>

    <!-- Scroll to Top Button -->
    <button id="scrollToTopBtn" class="scroll-to-top" aria-label="Scroll to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script type="module">
        // Scroll to top functionality
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');

        // Navbar and Scroll to top effect
        window.onscroll = function() {
            const nav = document.getElementById('navbar');
            if (window.pageYOffset > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }

            if (window.pageYOffset > 300) {
                scrollToTopBtn.classList.add('visible');
            } else {
                scrollToTopBtn.classList.remove('visible');
            }
        };

        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Mobile Menu Toggle
        const mobileToggle = document.getElementById('mobile-toggle');
        const navLinks = document.getElementById('nav-links');
        mobileToggle.addEventListener('click', () => {
            mobileToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
            document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', (e) => {
                const isDropdown = link.parentElement.classList.contains('dropdown');
                if (window.innerWidth <= 768 && isDropdown) {
                    e.preventDefault();
                    link.parentElement.classList.toggle('active');
                } else {
                    mobileToggle.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        });

        // Fetch News Data from Firestore
        import { db } from './firebase-config.js';
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        async function loadNews() {
            try {
                const q = query(collection(db, 'news'), orderBy('date', 'desc'));
                const snapshot = await getDocs(q);
                const newsContainer = document.getElementById('news-all-container');
                
                newsContainer.innerHTML = snapshot.docs.map(doc => {
                    const item = doc.data();
                    return `
                    <div class="news-card">
                        <img src="${item.poster}" alt="${item.name}">
                        <div class="card-content">
                            <span class="category-tag" style="color: var(--primary-color); font-size: 0.8rem; font-weight: 700; text-transform: uppercase;">${item.category}</span>
                            <h3>${item.name}</h3>
                            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">${item.date}</p>
                            <a href="news-detail.html?news=${item.slug}" class="card-link">อ่านต่อ</a>
                        </div>
                    </div>
                `}).join('');

                // Hide loading overlay
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.classList.add('hidden');
                    setTimeout(() => overlay.remove(), 500);
                }
            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('news-all-container').innerHTML = '<p style="color: red; text-align: center;">ไม่สามารถโหลดข่าวได้</p>';
            }
        }

        loadNews();
    </script>
</body>
</html>
