<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcuteFilm Admin Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: white; padding: 2rem; max-width: 1000px; margin: 0 auto; line-height: 1.6; }
        h1 { color: #00d2ff; text-align: center; margin-bottom: 2rem; }
        
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid #333; padding-bottom: 1rem; }
        .tab-btn { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 0.5rem 1rem; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: rgba(0, 210, 255, 0.1); color: #00d2ff; }
        .tab-btn:hover { color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #1a1a1a; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid #333; }
        .card h2 { margin-top: 0; margin-bottom: 1.5rem; font-size: 1.3rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #ccc; }
        input, textarea, select { width: 100%; padding: 10px; background: #0f0f0f; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #00d2ff; }
        textarea { resize: vertical; min-height: 100px; }
        
        .btn { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; margin-top: 1rem; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #555; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #888; font-weight: normal; font-size: 0.9rem; }
        td { font-size: 0.95rem; }
        .btn-edit { background: #00d2ff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 5px; }
        .btn-delete { background: #ff0040; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 5px; }
        .btn-edit:hover { background: #00b0ff; }
        .btn-cancel { background: #555; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; margin-top: 0.5rem; display: none; }
        
        .img-preview { max-width: 50px; border-radius: 4px; }
        .status { margin-top: 1rem; padding: 10px; border-radius: 8px; display: none; text-align: center; }
        .status.success { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; display: block; }
        .status.error { background: rgba(255, 0, 0, 0.1); color: #ff5555; border: 1px solid #ff5555; display: block; }
    </style>
</head>
<body>

    <h1>AcuteFilm Admin Dashboard</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('movies')">🎬 ภาพยนตร์</button>
        <button class="tab-btn" onclick="switchTab('news')">📰 ข่าวสาร</button>
        <button class="tab-btn" style="margin-left: auto; background: rgba(0, 255, 0, 0.1); color: #44ff44;" onclick="importNewsFromJSON()">📥 Sync News</button>
        <button class="tab-btn" style="background: rgba(255, 255, 0, 0.1); color: #ffff44;" onclick="importMoviesFromJSON()">📥 Sync Movies</button>
        <button class="tab-btn" style="background: rgba(255,165,0,0.1); color: orange;" onclick="upgradeFirestoreData()">⚙️ อัปเกรดข้อมูล (One-time)</button>
    </div>

    <div id="status-message" class="status"></div>

    <!-- MOVIES SECTION -->
    <div id="tab-movies" class="tab-content active">
        <div class="card">
            <h2>เพิ่มภาพยนตร์ใหม่</h2>
            <form id="form-movie">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label>ชื่อภาพยนตร์ (Name)</label><input type="text" id="m_name" required></div>
                    <div class="form-group"><label>Slug (URL ภาษาอังกฤษ เช่น my-movie)</label><input type="text" id="m_slug" required></div>
                    <div class="form-group" style="grid-column: 1 / -1;"><label>ประเภทหนัง (เช่น AcuteFilm Originals)</label><input type="text" id="m_type" placeholder="เช่น AcuteFilm Originals" required></div>
                    <div class="form-group"><label>หมวดหมู่ (Genre)</label><input type="text" id="m_genre" required></div>
                    <div class="form-group"><label>ปีที่ฉาย (Release Year)</label><input type="text" id="m_release" required></div>
                    <div class="form-group"><label>ภาพโปสเตอร์ (เช่น img/poster.jpg)</label><input type="text" id="m_poster" value="img/" required></div>
                    <div class="form-group"><label>ภาพปกแบนเนอร์ (เช่น img/hero.jpg)</label><input type="text" id="m_hero" value="img/" required></div>
                    <div class="form-group"><label>ผู้กำกับ (Director)</label><input type="text" id="m_director" required></div>
                    <div class="form-group"><label>บทบาทของเรา (Our Role / Contribution)</label><input type="text" id="m_contribution" placeholder="เช่น Full Production หรือ Visual Effects" required></div>
                    <div class="form-group"><label>นักแสดง (Actors)</label><input type="text" id="m_actors" required></div>
                    <div class="form-group"><label>วิดีโอตัวอย่าง (YouTube Embed URL)</label><input type="text" id="m_video" required></div>
                </div>
                <div class="form-group">
                    <label>เรื่องย่อ (Synopsis)</label>
                    <textarea id="m_synopsis" required></textarea>
                </div>
                <button type="submit" class="btn" id="btn-submit-movie">บันทึกภาพยนตร์</button>
                <button type="button" class="btn-cancel" id="btn-cancel-movie" onclick="cancelEdit('movies')">ยกเลิกการแก้ไข</button>
            </form>
        </div>

        <div class="card">
            <h2>รายการภาพยนตร์ปัจจุบัน</h2>
            <table>
                <thead>
                    <tr>
                        <th>รูป</th>
                        <th>ชื่อภาพยนตร์</th>
                        <th>ประเภท</th>
                        <th>ปี</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="movie-table-body">
                    <tr><td colspan="5" style="text-align: center;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- NEWS SECTION -->
    <div id="tab-news" class="tab-content">
        <div class="card">
            <h2>เพิ่มข่าวสารใหม่</h2>
            <form id="form-news">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label>หัวข้อข่าว (Name)</label><input type="text" id="n_name" required></div>
                    <div class="form-group"><label>Slug (URL ภาษาอังกฤษ เช่น news-4)</label><input type="text" id="n_slug" required></div>
                    <div class="form-group"><label>หมวดหมู่ (Category)</label><input type="text" id="n_category" value="ข่าวสาร" required></div>
                    <div class="form-group"><label>วันที่เผยแพร่ (Date)</label><input type="text" id="n_date" required></div>
                    <div class="form-group" style="grid-column: 1 / -1;"><label>ภาพประกอบ (เช่น img/news1.jpg)</label><input type="text" id="n_poster" value="img/" required></div>
                </div>
                <div class="form-group">
                    <label>เนื้อหาข่าว (Content - สามารถใส่ HTML ได้ เช่น &lt;b&gt;, &lt;br&gt;)</label>
                    <textarea id="n_content" required></textarea>
                </div>
                <button type="submit" class="btn" id="btn-submit-news">บันทึกข่าวสาร</button>
                <button type="button" class="btn-cancel" id="btn-cancel-news" onclick="cancelEdit('news')">ยกเลิกการแก้ไข</button>
            </form>
        </div>

        <div class="card">
            <h2>รายการข่าวสารปัจจุบัน</h2>
            <table>
                <thead>
                    <tr>
                        <th>รูป</th>
                        <th>หัวข้อข่าว</th>
                        <th>วันที่</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="news-table-body">
                    <tr><td colspan="4" style="text-align: center;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy, where, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Upgrade Existing Data
        window.upgradeFirestoreData = async (e) => {
            if(!confirm("ต้องการอัปเกรดข้อมูลเดิม (เพิ่ม Type: AcuteFilm Originals) หรือไม่?")) return;
            const btn = e ? e.currentTarget : event.currentTarget;
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerText = "กำลังเชื่อมต่อ...";
            
            try {
                console.log("Starting data upgrade...");
                const snapshot = await getDocs(collection(db, 'movies'));
                console.log(`Found ${snapshot.docs.length} movies.`);
                let count = 0;
                for (const movieDoc of snapshot.docs) {
                    const data = movieDoc.data();
                    let updates = {};
                    if (!data.type) updates.type = "AcuteFilm Originals";
                    if (!data.director) updates.director = "Sedthanun Chongchetdee";
                    if (!data.contribution) {
                        const isOriginal = (data.type || updates.type || '').toLowerCase().includes('original');
                        updates.contribution = isOriginal ? "Full Production" : "Visual Effects";
                    }
                    
                    if (Object.keys(updates).length > 0) {
                        console.log(`Updating ${data.name}...`, updates);
                        await updateDoc(doc(db, 'movies', movieDoc.id), updates);
                        count++;
                    }
                }
                showMessage(`✅ อัปเกรดสำเร็จ! อัปเดตไป ${count} รายการ`);
                loadMovies();
            } catch (error) {
                console.error("Upgrade error:", error);
                showMessage(`❌ เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
            btn.disabled = false;
            btn.innerText = originalText;
        };

        // Sync News from JSON
        window.importNewsFromJSON = async (e) => {
            if(!confirm("ต้องการนำเข้า/อัปเดตข้อมูลข่าวสารจาก news.json หรือไม่?")) return;
            const btn = e ? e.currentTarget : event.currentTarget;
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerText = "กำลังนำเข้า...";
            
            try {
                const response = await fetch('news.json');
                const data = await response.json();
                const items = data.items;
                
                let count = 0;
                for (const item of items) {
                    // Use slug as document ID to update existing or create new
                    await setDoc(doc(db, 'news', item.slug), item);
                    count++;
                }
                showMessage(`✅ นำเข้าสำเร็จ! ประมวลผลไป ${count} รายการ`);
                loadNews();
            } catch (error) {
                console.error("Import error:", error);
                showMessage(`❌ เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
            btn.disabled = false;
            btn.innerText = originalText;
        };

        // Sync Movies from JSON
        window.importMoviesFromJSON = async (e) => {
            if(!confirm("ต้องการนำเข้า/อัปเดตข้อมูลภาพยนตร์จาก movies.json หรือไม่?")) return;
            const btn = e ? e.currentTarget : event.currentTarget;
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerText = "กำลังนำเข้า...";
            
            try {
                const response = await fetch('movies.json');
                const data = await response.json();
                const items = data.items;
                
                let count = 0;
                for (const item of items) {
                    // Use slug as document ID
                    await setDoc(doc(db, 'movies', item.slug), item);
                    count++;
                }
                showMessage(`✅ นำเข้าสำเร็จ! ประมวลผลไป ${count} รายการ`);
                loadMovies();
            } catch (error) {
                console.error("Import error:", error);
                showMessage(`❌ เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
            btn.disabled = false;
            btn.innerText = originalText;
        };

        // Editing State
        let editingMovieId = null;
        let editingNewsId = null;

        window.cancelEdit = (type) => {
            if (type === 'movies') {
                editingMovieId = null;
                document.getElementById('form-movie').reset();
                document.getElementById('btn-submit-movie').innerText = 'บันทึกภาพยนตร์';
                document.getElementById('btn-cancel-movie').style.display = 'none';
                document.getElementById('m_poster').value = 'img/';
                document.getElementById('m_hero').value = 'img/';
            } else {
                editingNewsId = null;
                document.getElementById('form-news').reset();
                document.getElementById('btn-submit-news').innerText = 'บันทึกข่าวสาร';
                document.getElementById('btn-cancel-news').style.display = 'none';
                document.getElementById('n_poster').value = 'img/';
            }
        };

        window.editItem = async (type, id) => {
            try {
                const docRef = doc(db, type, id);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (type === 'movies') {
                        editingMovieId = id;
                        document.getElementById('m_name').value = data.name || '';
                        document.getElementById('m_slug').value = data.slug || '';
                        document.getElementById('m_type').value = data.type || '';
                        document.getElementById('m_genre').value = data.genre || '';
                        document.getElementById('m_director').value = data.director || '';
                        document.getElementById('m_contribution').value = data.contribution || '';
                        document.getElementById('m_release').value = data.release || '';
                        document.getElementById('m_poster').value = data.poster || '';
                        document.getElementById('m_hero').value = data.hero || '';
                        document.getElementById('m_actors').value = data.actors || '';
                        document.getElementById('m_video').value = data.video || '';
                        document.getElementById('m_synopsis').value = data.synopsis || '';
                        
                        document.getElementById('btn-submit-movie').innerText = 'อัปเดตข้อมูลภาพยนตร์';
                        document.getElementById('btn-cancel-movie').style.display = 'block';
                        window.scrollTo({ top: document.getElementById('form-movie').offsetTop - 100, behavior: 'smooth' });
                    } else {
                        editingNewsId = id;
                        document.getElementById('n_name').value = data.name || '';
                        document.getElementById('n_slug').value = data.slug || '';
                        document.getElementById('n_category').value = data.category || '';
                        document.getElementById('n_date').value = data.date || '';
                        document.getElementById('n_poster').value = data.poster || '';
                        document.getElementById('n_content').value = data.content || '';
                        
                        document.getElementById('btn-submit-news').innerText = 'อัปเดตข้อมูลข่าวสาร';
                        document.getElementById('btn-cancel-news').style.display = 'block';
                        window.scrollTo({ top: document.getElementById('form-news').offsetTop - 100, behavior: 'smooth' });
                    }
                }
            } catch (error) {
                showMessage(`❌ ดึงข้อมูลไม่สำเร็จ: ${error.message}`, 'error');
            }
        };

        // UI Management
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        const showMessage = (msg, type = 'success') => {
            const el = document.getElementById('status-message');
            el.innerText = msg;
            el.className = `status ${type}`;
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        };

        // --- MOVIES LOGIC ---
        const loadMovies = async () => {
            const tbody = document.getElementById('movie-table-body');
            try {
                const q = query(collection(db, 'movies'), orderBy('release', 'desc'));
                const snapshot = await getDocs(q);
                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${data.poster}" class="img-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                            <td>${data.name}<br><small style="color:#888">${data.slug}</small></td>
                            <td>${data.type || data.genre}<br><small style="color:#666">Dir: ${data.director || 'N/A'}</small><br><small style="color:var(--primary-color)">Role: ${data.contribution || 'N/A'}</small></td>
                            <td>${data.release}</td>
                            <td>
                                <button class="btn-edit" onclick="editItem('movies', '${doc.id}')">แก้ไข</button>
                                <button class="btn-delete" onclick="deleteItem('movies', '${doc.id}')">ลบ</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Error: ${error.message}</td></tr>`;
            }
        };

        document.getElementById('form-movie').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-movie');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const newMovie = {
                name: document.getElementById('m_name').value,
                slug: document.getElementById('m_slug').value,
                type: document.getElementById('m_type').value,
                genre: document.getElementById('m_genre').value,
                director: document.getElementById('m_director').value,
                contribution: document.getElementById('m_contribution').value,
                release: document.getElementById('m_release').value,
                poster: document.getElementById('m_poster').value,
                hero: document.getElementById('m_hero').value,
                actors: document.getElementById('m_actors').value,
                video: document.getElementById('m_video').value,
                synopsis: document.getElementById('m_synopsis').value
            };

            try {
                if (editingMovieId) {
                    await setDoc(doc(db, 'movies', editingMovieId), newMovie);
                    showMessage('✅ อัปเดตภาพยนตร์สำเร็จ!');
                    cancelEdit('movies');
                } else {
                    await addDoc(collection(db, 'movies'), newMovie);
                    showMessage('✅ เพิ่มภาพยนตร์สำเร็จ!');
                    document.getElementById('form-movie').reset();
                    document.getElementById('m_poster').value = 'img/';
                    document.getElementById('m_hero').value = 'img/';
                }
                loadMovies();
            } catch (error) {
                showMessage(`❌ เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
            btn.disabled = false;
            btn.innerText = 'บันทึกภาพยนตร์';
        });

        // --- NEWS LOGIC ---
        const loadNews = async () => {
            const tbody = document.getElementById('news-table-body');
            try {
                const q = query(collection(db, 'news'), orderBy('date', 'desc'));
                const snapshot = await getDocs(q);
                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${data.poster}" class="img-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                            <td>${data.name}<br><small style="color:#888">${data.slug}</small></td>
                            <td>${data.date}</td>
                            <td>
                                <button class="btn-edit" onclick="editItem('news', '${doc.id}')">แก้ไข</button>
                                <button class="btn-delete" onclick="deleteItem('news', '${doc.id}')">ลบ</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Error: ${error.message}</td></tr>`;
            }
        };

        document.getElementById('form-news').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-news');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const newNews = {
                name: document.getElementById('n_name').value,
                slug: document.getElementById('n_slug').value,
                category: document.getElementById('n_category').value,
                date: document.getElementById('n_date').value,
                poster: document.getElementById('n_poster').value,
                content: document.getElementById('n_content').value
            };

            try {
                if (editingNewsId) {
                    await setDoc(doc(db, 'news', editingNewsId), newNews);
                    showMessage('✅ อัปเดตข่าวสารสำเร็จ!');
                    cancelEdit('news');
                } else {
                    await addDoc(collection(db, 'news'), newNews);
                    showMessage('✅ เพิ่มข่าวสารสำเร็จ!');
                    document.getElementById('form-news').reset();
                    document.getElementById('n_poster').value = 'img/';
                }
                loadNews();
            } catch (error) {
                showMessage(`❌ เกิดข้อผิดพลาด: ${error.message}`, 'error');
            }
            btn.disabled = false;
            btn.innerText = 'บันทึกข่าวสาร';
        });

        // --- GLOBAL DELETE LOGIC ---
        window.deleteItem = async (collectionName, id) => {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้? (ไม่สามารถกู้คืนได้)')) {
                try {
                    await deleteDoc(doc(db, collectionName, id));
                    showMessage('🗑️ ลบรายการสำเร็จ!');
                    if (collectionName === 'movies') loadMovies();
                    else loadNews();
                } catch (error) {
                    showMessage(`❌ ลบไม่สำเร็จ: ${error.message}`, 'error');
                }
            }
        };

        // Initialize lists on load
        loadMovies();
        loadNews();
    </script>
</body>
</html>
