  <script>
    const popup = document.querySelector('.full-screen');

    function togglePopup(){
      popup.classList.toggle('hidden');

    }
    $('button.stop-video').click(function(){
	$('.youtube-video')[0].contentWindow.postMessage('{"event":"command","func":"' + 'stopVideo' + '","args":""}', '*');
});



   function showNews(list) {
      console.log(list.news.items);
      for (var i = 0; i < list.news.items.length; i++) {
        let new_elm = document.getElementById("show");
        var newl = list.news.items[i];

          new_elm.innerHTML +=
          `<div class="col-lg-5 col-md-6 mt-3">
      <div class="card rounded shadow">
        <img class="card-img-top p-0" src="${newl.poster}" loading="lazy"/>
        <div class="card-body">
          <h5>
            <a href="news-detail.html?news=${newl.slug}">${newl.name}</a>
            
          </h5>
          <a href="news-detail.html?news=${newl.slug}" class="disabled">News</a>
        </div>
        </div>
        </div>   
     `
      }
    }
    jQuery.getJSON("/news.json", showNews)
    //jQuery.getJSON("/news.json")

  </script>
