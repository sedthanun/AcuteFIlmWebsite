    <script>
      window.onload = function () {
        // Call the loadMovieDetails function once the page is loaded
        loadNews();
      };
      window.addEventListener("load", function () {
        // Hide the loading overlay when the page has fully loaded
        document.getElementById("loading-overlay").style.display = "none";
      });

      async function loadNews() {
        const urlParams = new URLSearchParams(window.location.search);
        const newsSlug = urlParams.get("news");

        console.log(urlParams);
        console.log(newsSlug);

        if (!newsSlug) {
          document.body.innerHTML = "<h2>News1 Not Found</h2>";
          return;
        }
        const response = await fetch("/news.json");
        const news = await response.json();
        console.log(news.news.items);
        const newl = news.news.items.find((n) => n.slug === newsSlug);

        if (newl) {
          console.log(newl.name);
          const storyWithHtml = newl.story;
          document.getElementById("newsCategory").innerText = newl.category;
          document.getElementById("newsHeading").innerText = newl.name;
          document.getElementById("newslmg").src = newl.poster;
          document.getElementById("newsStory").innerHTML = newl.story;
          document.getElementById("lastEdited").innerText =
            "Last Edited: " + newl.date;
          //console.log("find newl now");
        } else {
          document.body.innerHTML = "<h2>News2 Not Found</h2>";
        }
      }
    </script>
